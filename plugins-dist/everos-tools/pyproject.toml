[project]
name = "raven-everos-tools"
version = "0.1.0"
description = "Unified EverOS recall and retain tools plugin for Raven"
requires-python = ">=3.12"
dependencies = ["raven", "httpx"]

[tool.uv.sources]
raven = { workspace = true }

[project.entry-points."raven.plugins"]
everos-tools = "raven_everos_tools.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_everos_tools"]

[tool.hatch.build]
include = [
    "raven_everos_tools/**/*.py",
    "raven_everos_tools/raven-plugin.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven_everos_tools/",
    "pyproject.toml",
]
